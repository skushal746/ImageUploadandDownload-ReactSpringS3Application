<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="620" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="bold">System Architecture — Image Upload &amp; Download (React · Spring Boot · AWS S3)</text>

  <!-- ── LAYER LABELS ─────────────────────────────────────────────── -->
  <text x="30" y="100" fill="#64748b" font-size="11" font-weight="bold" letter-spacing="1">CLIENT</text>
  <text x="30" y="240" fill="#64748b" font-size="11" font-weight="bold" letter-spacing="1">SPRING BOOT BACKEND</text>
  <text x="30" y="490" fill="#64748b" font-size="11" font-weight="bold" letter-spacing="1">AWS CLOUD</text>

  <!-- ── LAYER BANDS ───────────────────────────────────────────────── -->
  <!-- Client band -->
  <rect x="20" y="108" width="860" height="90" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <!-- Backend band -->
  <rect x="20" y="248" width="860" height="210" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <!-- AWS band -->
  <rect x="20" y="498" width="860" height="100" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>

  <!-- ── CLIENT LAYER ──────────────────────────────────────────────── -->
  <!-- React Frontend Box -->
  <rect x="330" y="122" width="240" height="62" rx="8" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="450" y="148" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">React Frontend</text>
  <text x="450" y="165" text-anchor="middle" fill="#7dd3fc" font-size="11">Browser · localhost:3000</text>
  <text x="450" y="178" text-anchor="middle" fill="#94a3b8" font-size="10">Profile cards · File picker · Image preview</text>

  <!-- ── BACKEND LAYER ─────────────────────────────────────────────── -->
  <!-- REST Controller -->
  <rect x="60" y="268" width="200" height="62" rx="8" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
  <text x="160" y="292" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="bold">REST Controller</text>
  <text x="160" y="308" text-anchor="middle" fill="#d8b4fe" font-size="10">UserProfileController</text>
  <text x="160" y="320" text-anchor="middle" fill="#94a3b8" font-size="10">GET / POST  ·  CORS *</text>

  <!-- Service Layer -->
  <rect x="340" y="268" width="220" height="62" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="292" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">Service Layer</text>
  <text x="450" y="308" text-anchor="middle" fill="#fde68a" font-size="10">UserProfileService</text>
  <text x="450" y="320" text-anchor="middle" fill="#94a3b8" font-size="10">Validation · Orchestration</text>

  <!-- FileStore -->
  <rect x="640" y="268" width="200" height="62" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="740" y="292" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">FileStore</text>
  <text x="740" y="308" text-anchor="middle" fill="#6ee7b7" font-size="10">FileStore.java</text>
  <text x="740" y="320" text-anchor="middle" fill="#94a3b8" font-size="10">save() · download() · list()</text>

  <!-- Data Access -->
  <rect x="200" y="380" width="220" height="62" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/>
  <text x="310" y="404" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">Data Access Layer</text>
  <text x="310" y="420" text-anchor="middle" fill="#fca5a5" font-size="10">UserProfileDataAccessService</text>
  <text x="310" y="432" text-anchor="middle" fill="#94a3b8" font-size="10">In-memory ArrayList store</text>

  <!-- Config -->
  <rect x="500" y="380" width="200" height="62" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="600" y="404" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold">AmazonConfig</text>
  <text x="600" y="420" text-anchor="middle" fill="#67e8f9" font-size="10">AmazonConfig.java</text>
  <text x="600" y="432" text-anchor="middle" fill="#94a3b8" font-size="10">AmazonS3 Bean · US-EAST-2</text>

  <!-- ── AWS LAYER ──────────────────────────────────────────────────── -->
  <!-- S3 Bucket -->
  <rect x="290" y="513" width="320" height="68" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="538" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">AWS S3 Bucket</text>
  <text x="450" y="554" text-anchor="middle" fill="#fde68a" font-size="10">react-spring-s3-application  ·  us-east-2</text>
  <text x="450" y="568" text-anchor="middle" fill="#94a3b8" font-size="10">Path: /{userProfileId}/{filename}-{uuid}</text>

  <!-- ── ARROWS ─────────────────────────────────────────────────────── -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0ea5e9"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Client → Controller (HTTP REST) -->
  <line x1="380" y1="184" x2="220" y2="268" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="280" y="232" fill="#38bdf8" font-size="10" transform="rotate(-28,280,232)">HTTP REST  multipart/form-data</text>

  <!-- Controller → Service -->
  <line x1="260" y1="299" x2="340" y2="299" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Service → FileStore -->
  <line x1="560" y1="299" x2="640" y2="299" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Service → DataAccess -->
  <line x1="420" y1="330" x2="370" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FileStore → Config -->
  <line x1="680" y1="330" x2="650" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FileStore → S3 -->
  <line x1="740" y1="330" x2="580" y2="513" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="690" y="430" fill="#34d399" font-size="10" transform="rotate(-55,690,430)">putObject / getObject</text>

  <!-- Config → S3 (auth) -->
  <line x1="570" y1="442" x2="490" y2="513" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="495" y="480" fill="#22d3ee" font-size="9">BasicAWSCredentials</text>

  <!-- ── LEGEND ─────────────────────────────────────────────────────── -->
  <rect x="640" y="420" width="220" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="750" y="438" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">LEGEND</text>
  <line x1="655" y1="450" x2="685" y2="450" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="690" y="453" fill="#94a3b8" font-size="10">HTTP / network call</text>
  <line x1="655" y1="465" x2="685" y2="465" stroke="#475569" stroke-width="1.5"/>
  <text x="690" y="468" fill="#94a3b8" font-size="10">In-process method call</text>
  <line x1="655" y1="480" x2="685" y2="480" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="690" y="483" fill="#94a3b8" font-size="10">AWS SDK S3 operation</text>
</svg>
